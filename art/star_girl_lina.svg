<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ffe3f4"/>
      <stop offset="0.55" stop-color="#f3a9d8"/>
      <stop offset="1" stop-color="#7b4fc4"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a2b"/>
      <stop offset="0.35" stop-color="#c98a4b"/>
      <stop offset="1" stop-color="#f4cf8a"/>
    </linearGradient>
    <linearGradient id="hairFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5532"/>
      <stop offset="1" stop-color="#d9a05c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1c2a8"/>
      <stop offset="0.5" stop-color="#fbdcc8"/>
      <stop offset="1" stop-color="#efbea3"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="65%" r="60%">
      <stop offset="0" stop-color="#d9b8ff"/>
      <stop offset="0.55" stop-color="#8a4fe0"/>
      <stop offset="1" stop-color="#3a1670"/>
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8ccf"/>
      <stop offset="1" stop-color="#e2509f"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#8462e6"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6dcf5"/>
    </linearGradient>
    <linearGradient id="lips" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6fae"/>
      <stop offset="1" stop-color="#d63c86"/>
    </linearGradient>
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10 Z" fill="#fff"/>
    </symbol>
    <symbol id="star5" viewBox="-10 -10 20 20">
      <path d="M0 -9.5 L2.6 -3.2 L9.4 -2.9 L4.1 1.4 L5.9 8 L0 4.3 L-5.9 8 L-4.1 1.4 L-9.4 -2.9 L-2.6 -3.2 Z"/>
    </symbol>
  </defs>

  <!-- background -->
