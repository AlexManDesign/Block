  <path d="M206 380 C200 400 196 415 194 430" stroke="#fff" stroke-width="3" opacity="0.4" fill="none" stroke-linecap="round"/>
  <path d="M390 380 C396 400 400 420 402 440" stroke="#c43c87" stroke-width="3" opacity="0.5" fill="none" stroke-linecap="round"/>
