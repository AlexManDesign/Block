  <path d="M300 236 C301 244 304 248 307 247" stroke="#d08f78" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M286 262 C292 257 297 259 300 260 C303 259 308 257 314 262 C308 272 292 272 286 262 Z" fill="url(#lips)"/>
  <path d="M287 262 C295 265 305 265 313 262" stroke="#a82a66" stroke-width="1.2" fill="none"/>
  <ellipse cx="304" cy="267" rx="4" ry="1.6" fill="#fff" opacity="0.75"/>

  <!-- choker -->
  <path d="M282 300 C292 306 308 306 318 300" stroke="#3b2466" stroke-width="5" fill="none"/>
  <use href="#star5" x="294" y="302" width="12" height="12" fill="#ffd84a"/>

  <!-- front side locks -->
  <path d="M238 186 C218 250 232 300 214 360 C202 404 222 440 244 428 C232 396 254 352 248 300 C244 258 254 222 238 186 Z" fill="url(#hairFront)"/>
  <path d="M362 186 C382 250 368 300 386 360 C398 404 378 440 356 428 C368 396 346 352 352 300 C356 258 346 222 362 186 Z" fill="url(#hairFront)"/>

  <!-- bangs -->
  <path d="M226 210 C218 140 258 104 300 104 C346 104 384 140 374 210 C364 180 350 164 334 152 C328 178 314 188 296 194 C302 176 300 162 292 150 C276 172 256 182 240 184 C234 192 230 200 226 210 Z" fill="url(#hairFront)"/>
  <path d="M262 124 C282 112 318 112 340 124" stroke="#ffe7b0" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M236 230 C230 270 236 300 226 340" stroke="#ffe7b0" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M364 230 C370 270 364 300 374 340" stroke="#ffe7b0" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>

