  <path d="M300 100 C205 100 188 175 200 255 C210 320 178 380 188 450 C196 505 222 540 252 528 C262 520 270 505 268 490 L332 490 C330 505 338 520 348 528 C378 540 404 505 412 450 C422 380 390 320 400 255 C412 175 395 100 300 100 Z" fill="url(#hair)"/>
