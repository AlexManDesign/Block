    <rect x="238" y="898" width="62" height="16" rx="6" fill="#ff8ccf"/>
    <rect x="264" y="790" width="36" height="12" rx="5" fill="#ff8ccf"/>
    <path d="M272 815 L292 822 M272 835 L292 842 M272 855 L292 862" stroke="#b79cff" stroke-width="3" stroke-linecap="round"/>
    <path d="M314 790 L346 790 L346 868 L360 880 C374 886 374 900 364 900 L320 900 C314 898 314 892 314 880 Z" fill="url(#boot)" stroke="#c9b6ea" stroke-width="2"/>
