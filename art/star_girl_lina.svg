    <use href="#sparkle" x="500" y="90" width="44" height="44"/>
    <use href="#sparkle" x="480" y="330" width="22" height="22"/>
    <use href="#sparkle" x="70" y="420" width="26" height="26"/>
    <use href="#sparkle" x="520" y="620" width="30" height="30"/>
    <use href="#sparkle" x="40" y="700" width="20" height="20"/>
    <use href="#sparkle" x="150" y="60" width="18" height="18"/>
