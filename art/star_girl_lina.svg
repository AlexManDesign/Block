  <use href="#sparkle" x="364" y="118" width="14" height="14"/>

  <!-- name ribbon -->
  <g transform="translate(300 960)">
    <path d="M-110 -22 L110 -22 L126 0 L110 22 L-110 22 L-126 0 Z" fill="#3b2466" opacity="0.85"/>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#fff">★ Лина ★</text>
  </g>
</svg>
