    <path d="M245 212 L236 206 M248 206 L240 199 M253 202 L247 194" stroke="#1d0a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M252 228 C262 232 280 232 288 224" stroke="#b07a6a" stroke-width="1.5" fill="none"/>
  </g>
  <!-- right eye -->
  <g>
    <path d="M354 214 C348 200 316 198 308 212 C312 230 348 232 354 214 Z" fill="#fff"/>
    <circle cx="330" cy="216" r="13.5" fill="url(#iris)"/>
    <circle cx="330" cy="217" r="6" fill="#1d0a3a"/>
    <circle cx="335" cy="210" r="4" fill="#fff"/>
    <circle cx="324" cy="222" r="2" fill="#fff" opacity="0.9"/>
    <path d="M357 213 C350 197 316 194 306 211" stroke="#1d0a1a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M355 212 L364 206 M352 206 L360 199 M347 202 L353 194" stroke="#1d0a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M348 228 C338 232 320 232 312 224" stroke="#b07a6a" stroke-width="1.5" fill="none"/>
