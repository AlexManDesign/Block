    <rect x="312" y="790" width="36" height="12" rx="5" fill="#ff8ccf"/>
    <path d="M320 822 L340 815 M320 842 L340 835 M320 862 L340 855" stroke="#b79cff" stroke-width="3" stroke-linecap="round"/>
